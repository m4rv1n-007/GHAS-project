name: E2E Test
on: [push, pull_request]

jobs:
  e2e-test:
    name: Node.js E2E
    runs-on: ubuntu-20.04   # ✅ CRITICAL FIX

    strategy:
      fail-fast: false
      matrix:
        node-version: ["16.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.x

      - name: Cache npm & Cypress
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (keep vulnerable)
        run: |
          npm ci --no-audit --no-fund
          npm run cy:verify

      - name: Start MongoDB
        run: |
          docker run -d -p 27017:27017 mongo:4.0
          timeout 60s bash -c 'until nc -z localhost 27017; do sleep 2; done'

      - name: Run E2E test suite
        run: |
          NODE_ENV=test npm start -- --silent &
          sleep 10
          npm run test:ci

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: test/e2e
